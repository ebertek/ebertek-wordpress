name: Build and release WordPress

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: wordpress-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve WordPress version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          from="$(sed -nE 's/^FROM (wordpress:[^[:space:]]+).*$/\1/p' Dockerfile)"
          if [[ ! "$from" =~ ^wordpress:([0-9]+\.[0-9]+\.[0-9]+)-php8\.5-fpm-alpine(@sha256:[a-f0-9]{64})?$ ]]; then
            echo "Unexpected Dockerfile FROM: $from" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          upstream_tag="$version-php8.5-fpm-alpine"
          revision="${GITHUB_SHA:0:12}"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: wordpress-smoke:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint php wordpress-smoke:local -r \
            'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 5) { exit(1); }'
          docker run --rm --entrypoint php wordpress-smoke:local -r \
            'foreach (["mysqli", "intl", "pdo_mysql", "imagick", "gd", "zip"] as $ext) { if (!extension_loaded($ext)) { fwrite(STDERR, "$ext missing\n"); exit(1); } }'
          docker run --rm --entrypoint php-fpm wordpress-smoke:local -t
          test "$(docker image inspect wordpress-smoke:local --format '{{.Config.User}}')" = 'www-data'

      - name: Publish images
        shell: bash
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION_TAG: ${{ steps.version.outputs.upstream_tag }}
          REVISION: ${{ steps.version.outputs.revision }}
        run: |
          set -euo pipefail
          docker tag wordpress-smoke:local "$IMAGE:$VERSION_TAG-$REVISION"
          docker tag wordpress-smoke:local "$IMAGE:$VERSION_TAG"
          docker tag wordpress-smoke:local "$IMAGE:php8.5-fpm-alpine"
          docker push "$IMAGE:$VERSION_TAG-$REVISION"
          docker push "$IMAGE:$VERSION_TAG"
          docker push "$IMAGE:php8.5-fpm-alpine"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION_TAG: ${{ steps.version.outputs.upstream_tag }}
          REVISION: ${{ steps.version.outputs.revision }}
        run: |
          set -euo pipefail
          release="v$VERSION-php8.5-$REVISION"
          if ! gh release view "$release" >/dev/null 2>&1; then
            gh release create "$release" \
              --target "$GITHUB_SHA" \
              --title "WordPress $VERSION (PHP 8.5, build $REVISION)" \
              --notes "Custom rebuild based on the pinned upstream WordPress base image. Immutable-by-convention image: $IMAGE:$VERSION_TAG-$REVISION" \
              --latest
          fi
